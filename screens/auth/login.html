<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | PizzaFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header class="site-header"><a href="../../index.html" class="font-bold">PizzaFlow</a><nav class="flex flex-wrap gap-3 text-sm"><a href="login.html" class="underline">Login</a> <a href="register.html" class="underline">Cadastro</a></nav></header>
  <!-- Tela: Login: e-mail e senha, link para cadastro e mensagens de erro de validação. Substitua o conteúdo de <main> pelo layout do Figma. -->
  <main class="p-4 max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">Login</h1>
    <form class="card max-w-sm mx-auto space-y-3">
  <label class="block">E-mail <input type="email" class="input" placeholder="voce@email.com"></label>
  <label class="block">Senha <input type="password" class="input"></label>
  <button type="button" class="btn">Entrar</button>
  <p class="text-sm"><a href="register.html" class="underline">Criar conta</a></p>
</form>
  </main>
</body>
</html>
